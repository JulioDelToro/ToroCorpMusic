name: toro_music_teleprompter
description: "ToroCorp Music - Teleprompter & Video Studio for Guitarists and Musicians"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  gal: ^2.3.3
  record: ^7.1.2
  audio_session: ^0.2.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
